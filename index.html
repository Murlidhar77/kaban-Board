<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaban Board</title>
    <link rel="shortcut icon" href="/images/beach.png" type="image/x-icon">
    <link rel="stylesheet" href="kaban.css">
</head>

<body>
    <!-- //sidebarsection -->
    <aside class="sidebar">
        <div class="above">
            <div class="text">
                <h1>KanbanBoard</h2>
            </div>
            <div class="text2">
                <h3><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-list preview-icon"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7"/><path d="M14 9h7"/><path d="M14 15h7"/><path d="M14 20h7"/></svg>Board</h3>
                <h3><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-check preview-icon"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m16 9-5.5 5.5L8 12"/></svg> Add Task</h3>
            </div>
        </div>
        <div class="down">
            <img src="/images/database.png" alt="">
            <p>Saved To loacl storage <span class="green circle"></span></p>
        </div>
    </aside>

    <!-- //navbar -->
    <nav class="navbar">
        <ul>
            <div class="left-side">
                <li>
                    <h1>Kaban Board</h1>
                </li>
                <div class="tag">
                    <li>plan</li>
                    <span class="Spectator"></span>
                    <li>Organize</li>
                    <span class="Spectator"></span>
                    <li>Settle</li>
                </div>
            </div>
            <div class="right-side">
                <button id="create">Create</button>
                <button id="toggle-theme"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f1964b" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun preview-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
                <div id="profile">
                    <img src="/images/user.png" alt="" id="profile-img">
                </div>
            </div>
        </ul>
    </nav>

    <main>

        <!-- //form-scetion -->
        <div class="overlay1" style="display: none;">
            <section class="profile">
                <div class="button">
                    <div></div>
                    <button id="close-profile">X</button>
                </div>
                <h3>Enter the name to profile</h3>
                <input type="text" id="name">
                <h3>Enter the Image url for Porfile</h3>
                <input type="text" id="image">
                <button id="done">Set Profile</button>
            </section>
        </div>
        <div class="overlay2" style="display: none;">
            <section class="info">
                  <div class="button">
                    <div></div>
                    <button id="close-task">X</button>
                </div>
                <h3>Welcome <span id="name-task">Name</span></h3>
                <input type="text" id="task" placeholder="Enter task">
                <input type="text" id="desicription" placeholder="Enter Description">
                <button id="Submit">Submit</button>
            </section>
        </div>


        <!-- //todoscteion -->
        <section id="todo" ">
            <h1>To Do<span id="count">1</span></h1>
        </section>

        <!-- //In-progresssection -->
        <section id="In-progress">
            <h1>In Progress<span id="count">1</span></h1>
            
        </section>

        <!-- //done-section -->
        <section id="Done">
            <h1>Done<span id="count">1</span></h1>
        </section>

    </main>
    <script src="kaban.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script></script>
</body>

</html>
